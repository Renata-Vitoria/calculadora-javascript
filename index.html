
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Calculadora desenvolvida com HTML, CSS e JavaScript como projeto de estudo.">

    <title>Calc.js | Calculadora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="./index.js" defer></script>
</head>

<body>
    <main data-theme="dark">

        <header class="flex align-center justify-between">
            <h1>Calc.js</h1>
            <button type="button" id="themeSwitcher">
                Alternar tema
            </button>
        </header>

        <input
            type="text"
            id="input"
            aria-label="Expressão matemática"
            placeholder="Digite uma operação"
            autocomplete="off"
            spellcheck="false"
        >

        <div id="keys">

            <button type="button" id="clear">C</button>

            <button type="button" class="charKey" data-value=" ( ">(</button>
            <button type="button" class="charKey" data-value=" ) ">)</button>
            <button type="button" class="charKey" data-value=" / ">/</button>

            <button type="button" class="charKey" data-value="7">7</button>
            <button type="button" class="charKey" data-value="8">8</button>
            <button type="button" class="charKey" data-value="9">9</button>
            <button type="button" class="charKey" data-value=" * ">*</button>

            <button type="button" class="charKey" data-value="4">4</button>
            <button type="button" class="charKey" data-value="5">5</button>
            <button type="button" class="charKey" data-value="6">6</button>
            <button type="button" class="charKey" data-value=" - ">-</button>

            <button type="button" class="charKey" data-value="1">1</button>
            <button type="button" class="charKey" data-value="2">2</button>
            <button type="button" class="charKey" data-value="3">3</button>
            <button type="button" class="charKey" data-value=" + ">+</button>

            <button type="button" class="charKey" data-value="0">0</button>
            <button type="button" class="charKey" data-value=".">.</button>
            <button type="button" class="charKey" data-value=" % ">mod</button>
            <button type="button" id="equal">=</button>

        </div>

        <section class="flex align-center justify-between">

            <button type="button" id="copyToClipboard">
                Copiar
            </button>

            <input
                type="text"
                id="result"
                aria-label="Resultado do cálculo"
                placeholder="Resultado"
                readonly
            >

        </section>

    </main>
</body>
</html>
